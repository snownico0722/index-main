name: UI regression
on:
  push:
    branches: [improve/visual-interaction-skins-20260920]
  pull_request:
    paths: ['**.html', 'js/**', 'css/**', 'book2html/**', 'tests/**', '.github/workflows/ui-regression.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Capture visual baseline
        run: |
          mkdir -p test-results
          git archive --format=zip --output=test-results/source.zip HEAD
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/index-main-http.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          (async () => {
            const browser = await chromium.launch();
            const results = [];
            for (const width of [1440, 390]) {
              const context = await browser.newContext({viewport: {width, height: 900}, deviceScaleFactor: 1});
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push(e.message));
              await page.route('**/*', route => new URL(route.request().url()).hostname === '127.0.0.1' ? route.continue() : route.abort());
              await page.goto('http://127.0.0.1:8080/index.html');
              for (const surface of ['glass', 'liquid', 'acrylic', 'mica', 'paper', 'obsidian', 'neon', 'pixel', 'plain']) {
                await page.evaluate(surface => localStorage.setItem('sitePreferences', JSON.stringify({surface})), surface);
                await page.reload();
                await page.waitForTimeout(1000);
                await page.screenshot({path: `test-results/before-${surface}-${width}.png`});
                results.push(await page.evaluate(({surface, width, errors}) => ({surface, width, errors: [...errors], overflow: document.documentElement.scrollWidth > innerWidth, controls: [...document.querySelectorAll('button')].map(x => ({id: x.id, label: x.getAttribute('aria-label'), text: x.textContent.trim().slice(0,50)})), dialogs: [...document.querySelectorAll('[role=dialog]')].map(x => ({id: x.id, hidden: x.hidden, modal: x.getAttribute('aria-modal')}))}), {surface, width, errors}));
              }
              await context.close();
            }
            fs.writeFileSync('test-results/baseline.json', JSON.stringify(results, null, 2));
            await browser.close();
          })().catch(e => {console.error(e); process.exit(1);});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-regression
          path: test-results/
          retention-days: 7
