name: UI regression
on:
  push:
    branches: [main, improve/visual-interaction-skins-20260920]
  pull_request:
    paths: ['**.html', 'js/**', 'css/**', 'book2html/**', 'scripts/**', 'tests/**', '.github/workflows/ui-regression.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development-only browser tools
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Check JavaScript syntax
        run: |
          for f in js/*.js book2html/data/js/*.js tests/*.cjs; do node --check "$f"; done
      - name: Check bookmark privacy and PowerShell syntax
        shell: pwsh
        run: ./tests/bookmark-regression.ps1
      - name: Browser regression and screenshots
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/index-main-http.log 2>&1 &
          node tests/ui-regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-regression
          path: test-results/
          retention-days: 7
